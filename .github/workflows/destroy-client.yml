name: Destroy client
on:
  workflow_dispatch:
    inputs:
      client_slug:
        required: true
        description: 'e.g. acme-corp'

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Repo variable (Settings → Actions → Variables), not hardcoded.
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.0'

      - name: Terraform init
        run: terraform -chdir=terraform init -backend-config="bucket=${GCP_PROJECT}-tf-state"

      - name: Select workspace
        run: terraform -chdir=terraform workspace select ${{ inputs.client_slug }}

      - name: Terraform destroy
        run: terraform -chdir=terraform destroy -auto-approve -var-file=../clients/${{ inputs.client_slug }}.tfvars

      - name: Switch back to default workspace and delete client workspace
        run: |
          terraform -chdir=terraform workspace select default
          terraform -chdir=terraform workspace delete ${{ inputs.client_slug }}
