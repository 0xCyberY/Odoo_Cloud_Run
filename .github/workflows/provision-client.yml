name: Provision client
# Two independent triggers, one job:
#   workflow_dispatch  — manual path, branches on whether client_slug is
#     already in clients.yaml (see "Determine whether client_slug already
#     exists" step below):
#       exists     -> scripts/provision.py, re-provisioning/reconciling an
#                     EXISTING entry (drift guard: _reconcile_database_drift),
#                     same as before. The addon_repos/selected_addons/etc.
#                     inputs below are ignored on this path — the entry's
#                     own clients.yaml values already govern it.
#       not exists -> scripts/onboard_client.py, same as the automated path
#                     below, using the addon_repos/selected_addons/domain/
#                     contact_email/region inputs. Lets a human onboard a
#                     client from the Actions UI without needing a PAT to
#                     fire repository_dispatch. DNS (A record + Certificate
#                     Manager CNAME) is always a manual step at the client's
#                     own DNS provider — this repo doesn't manage DNS itself.
#   repository_dispatch (types: client-onboarding) — automated path: calls
#     scripts/onboard_client.py, which adds the clients.yaml entry itself
#     from client_payload, then runs the whole provisioning flow. Fired
#     directly via `gh api repos/:owner/:repo/dispatches -f
#     event_type=client-onboarding -f client_payload[...]=...` (fine-grained
#     PAT) — no wrapping API service. The caller can be a human's terminal,
#     an external script, or a step in another GitHub Actions workflow.
on:
  workflow_dispatch:
    inputs:
      client_slug:
        required: true
        description: 'Client to provision, e.g. acme-corp'
      domain:
        required: false
        description: 'New client only: client domain, e.g. acme.nomowsoft.com'
      contact_email:
        required: false
        description: 'New client only: onboarding contact, e.g. ops@acme.com'
      addon_repos:
        required: false
        description: 'New client only: catalog keys entitled to, e.g. Human-Resources,Accounting'
      selected_addons:
        required: false
        description: 'New client only: subset to auto-install, e.g. Human-Resources'
      region:
        required: false
        default: 'europe-west1'
        description: 'New client only: GCP region, e.g. europe-west1'
  repository_dispatch:
    types: [client-onboarding]

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Repo variable (Settings → Actions → Variables), not hardcoded — this
      # is the project the shared stack + terraform state bucket live in.
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      TF_VAR_gcp_project: ${{ vars.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.0'

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt -q

      # ── Manual path (workflow_dispatch) ─────────────────────────────────
      - name: Determine whether client_slug already exists in clients.yaml
        if: github.event_name == 'workflow_dispatch'
        id: check_client
        env:
          INPUT_CLIENT_SLUG: ${{ inputs.client_slug }}
        run: |
          python3 -c "import os, sys, yaml; c = yaml.safe_load(open('clients/clients.yaml')) or {}; sys.exit(0 if os.environ['INPUT_CLIENT_SLUG'] in (c.get('clients') or {}) else 1)" \
            && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Provision client (existing entry — shared infra, terraform, DB init)
        if: github.event_name == 'workflow_dispatch' && steps.check_client.outputs.exists == 'true'
        run: python3 scripts/provision.py --client ${{ inputs.client_slug }} --init-db

      - name: Notify
        if: always() && github.event_name == 'workflow_dispatch' && steps.check_client.outputs.exists == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 465
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          from: ${{ vars.NOTIFY_EMAIL_FROM }}
          to: ${{ vars.NOTIFY_EMAIL_TO }}
          subject: "[Odoo SaaS] Client '${{ inputs.client_slug }}' — provision ${{ job.status }}"
          body: |
            Client: ${{ inputs.client_slug }}
            Domain: ${{ inputs.domain }}
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # client_slug not found above -> treat this as a manual onboarding run,
      # same script and same addon auto-install behavior as the automated
      # repository_dispatch path below (selected_addons resolved to real
      # module names and passed in the init job's combined -i list — see
      # onboard_client.py's run_init_job/_auto_install_list).
      - name: Onboard client (new entry — validate, provision, install, fetch creds)
        if: github.event_name == 'workflow_dispatch' && steps.check_client.outputs.exists == 'false'
        id: onboard_manual
        env:
          GITHUB_TOKEN: ${{ secrets.ADDONS_GITHUB_TOKEN }}
          # Same $VAR-not-${{ }} discipline as the repository_dispatch step
          # below — workflow_dispatch inputs are free-text too.
          INPUT_CLIENT_SLUG: ${{ inputs.client_slug }}
          INPUT_DOMAIN: ${{ inputs.domain }}
          INPUT_CONTACT_EMAIL: ${{ inputs.contact_email }}
          INPUT_ADDON_REPOS: ${{ inputs.addon_repos }}
          INPUT_SELECTED_ADDONS: ${{ inputs.selected_addons }}
          INPUT_REGION: ${{ inputs.region }}
        run: |
          ARGS=(--client-slug "$INPUT_CLIENT_SLUG")
          ARGS+=(--domain "$INPUT_DOMAIN")
          ARGS+=(--contact-email "$INPUT_CONTACT_EMAIL")
          ARGS+=(--addon-repos "$INPUT_ADDON_REPOS")
          ARGS+=(--selected-addons "$INPUT_SELECTED_ADDONS")
          ARGS+=(--region "$INPUT_REGION")
          python3 scripts/onboard_client.py "${ARGS[@]}"

      - name: Notify DevOps/Product (manual onboarding — admin credentials for handover)
        if: always() && github.event_name == 'workflow_dispatch' && steps.check_client.outputs.exists == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 465
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          from: ${{ vars.NOTIFY_EMAIL_FROM }}
          to: ${{ vars.NOTIFY_EMAIL_TO }}
          subject: "[Odoo SaaS] Client '${{ inputs.client_slug }}' — onboarding ${{ job.status }}"
          body: |
            Client: ${{ inputs.client_slug }}
            Domain: ${{ inputs.domain }}
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Admin credentials (do NOT forward to the client — create and hand over
            a separate low-privilege user instead):
              user:     ${{ steps.onboard_manual.outputs.admin_user }}
              password: ${{ steps.onboard_manual.outputs.admin_password }}

      # ── Automated path (repository_dispatch: client-onboarding) ────────
      # client_payload fields: client_slug, domain (both required);
      # contact_email, addon_repos (comma-separated catalog keys),
      # selected_addons (comma-separated subset), region, gcp_project (falls
      # back to vars.GCP_PROJECT). DNS (A record + Certificate Manager
      # CNAME) is always a manual step at the client's own DNS provider —
      # this repo doesn't manage DNS itself.
      - name: Onboard client (validate, provision, install, fetch creds)
        if: github.event_name == 'repository_dispatch'
        id: onboard
        env:
          GITHUB_TOKEN: ${{ secrets.ADDONS_GITHUB_TOKEN }}
          # Every repository_dispatch payload field is routed through env:
          # and referenced below as a shell variable ("$VAR"), never as a
          # raw ${{ }} expression inside the script body. ${{ }} substitutes
          # as literal text into the script BEFORE bash parses it — with
          # attacker/caller-controlled payload data (the PAT that triggers
          # this event is explicitly meant to be held by "whoever operates
          # onboarding", not just repo maintainers) that's a script-injection
          # sink, not a safe value passthrough. $VAR shell-variable expansion
          # is not.
          PAYLOAD_CLIENT_SLUG: ${{ github.event.client_payload.client_slug }}
          PAYLOAD_DOMAIN: ${{ github.event.client_payload.domain }}
          PAYLOAD_CONTACT_EMAIL: ${{ github.event.client_payload.contact_email }}
          PAYLOAD_ADDON_REPOS: ${{ github.event.client_payload.addon_repos }}
          PAYLOAD_SELECTED_ADDONS: ${{ github.event.client_payload.selected_addons }}
          PAYLOAD_REGION: ${{ github.event.client_payload.region || 'europe-west1' }}
          PAYLOAD_GCP_PROJECT: ${{ github.event.client_payload.gcp_project || vars.GCP_PROJECT }}
        run: |
          ARGS=(--client-slug "$PAYLOAD_CLIENT_SLUG")
          ARGS+=(--domain "$PAYLOAD_DOMAIN")
          ARGS+=(--contact-email "$PAYLOAD_CONTACT_EMAIL")
          ARGS+=(--addon-repos "$PAYLOAD_ADDON_REPOS")
          ARGS+=(--selected-addons "$PAYLOAD_SELECTED_ADDONS")
          ARGS+=(--region "$PAYLOAD_REGION")
          ARGS+=(--gcp-project "$PAYLOAD_GCP_PROJECT")
          python3 scripts/onboard_client.py "${ARGS[@]}"

      - name: Notify DevOps/Product (onboarding — admin credentials for handover)
        if: always() && github.event_name == 'repository_dispatch'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 465
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          from: ${{ vars.NOTIFY_EMAIL_FROM }}
          to: ${{ vars.NOTIFY_EMAIL_TO }}
          subject: "[Odoo SaaS] Client '${{ github.event.client_payload.client_slug }}' — onboarding ${{ job.status }}"
          body: |
            Client: ${{ github.event.client_payload.client_slug }}
            Domain: ${{ github.event.client_payload.domain }}
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Admin credentials (do NOT forward to the client — create and hand over
            a separate low-privilege user instead):
              user:     ${{ steps.onboard.outputs.admin_user }}
              password: ${{ steps.onboard.outputs.admin_password }}
