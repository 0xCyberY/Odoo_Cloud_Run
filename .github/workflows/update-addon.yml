name: Update Odoo addon (Cloud Run)
# Rebuilds the shared image with the latest addon code, updates the module in
# the TARGET tenant's database only, then rolls the new image out.
# NOTE: the image is shared by all tenants — if the addon is used by several
# clients, prefer "Deploy fleet" which migrates every tenant sequentially with
# canary traffic shifting.

on:
  workflow_dispatch:
    inputs:
      client_slug:
        required: true
        description: 'Client slug (e.g. acme-corp)'
      module_name:
        required: true
        description: 'Odoo module to update (e.g. hr_payroll)'

concurrency:
  group: addon-update-${{ inputs.client_slug }}
  cancel-in-progress: false

env:
  REPO: odoo-v18-repo

jobs:
  update:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Load client config
        id: cfg
        run: |
          pip install pyyaml -q
          python3 << 'EOF'
          import yaml, os
          with open('clients/clients.yaml') as f:
              data = yaml.safe_load(f)
          c = data['clients']['${{ inputs.client_slug }}']
          out = open(os.environ['GITHUB_OUTPUT'], 'a')
          print(f'region={c["region"]}', file=out)
          print(f'project={c["gcp_project"]}', file=out)
          print(f'database={c["database"]}', file=out)
          EOF

      - name: Populate addon catalog from clients.yaml
        run: python3 scripts/prepare_addons.py --clean
        env:
          GITHUB_TOKEN: ${{ secrets.ADDONS_GITHUB_TOKEN }}

      - name: Entitlement guard — module must be in the client's plan
        # Shared rule (scripts/check_entitlement.py) so the CI gate cannot drift
        # from the runtime addon_entitlement module. Inputs passed via env, not
        # interpolated into the script body.
        env:
          CLIENT: ${{ inputs.client_slug }}
          MODULE: ${{ inputs.module_name }}
        run: python3 scripts/check_entitlement.py --client "$CLIENT" --module "$MODULE"

      - name: Build and push image (immutable SHA tag + latest)
        id: build
        run: |
          IMG="${{ steps.cfg.outputs.region }}-docker.pkg.dev/${{ steps.cfg.outputs.project }}/${REPO}/odoo-pooled"
          TAG="${GITHUB_SHA::12}"
          gcloud builds submit odoo-v18/ --tag "${IMG}:${TAG}" --project "${{ steps.cfg.outputs.project }}"
          gcloud artifacts docker tags add "${IMG}:${TAG}" "${IMG}:latest"
          echo "image=${IMG}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run Odoo module update via Cloud Run Job
        id: update
        run: |
          JOB_NAME="${{ inputs.client_slug }}-odoo-job-migration"
          gcloud run jobs update "${JOB_NAME}" \
            --image "${{ steps.build.outputs.image }}" \
            --region=${{ steps.cfg.outputs.region }} \
            --project=${{ steps.cfg.outputs.project }}
          # Override args for this execution only: update the single module.
          # The image entrypoint still runs, so odoo.conf is generated first.
          gcloud run jobs execute "${JOB_NAME}" \
            --region=${{ steps.cfg.outputs.region }} \
            --project=${{ steps.cfg.outputs.project }} \
            --args="-d,${{ steps.cfg.outputs.database }},-u,${{ inputs.module_name }},--stop-after-init" \
            --wait

      - name: Roll new image out to serving services
        run: |
          for svc in pooled-odoo websocket-odoo cron-runner-odoo; do
            gcloud run services update "${svc}" \
              --image "${{ steps.build.outputs.image }}" \
              --region=${{ steps.cfg.outputs.region }} \
              --project=${{ steps.cfg.outputs.project }}
          done

      - name: Notify
        if: always()
        run: python scripts/notify.py --client ${{ inputs.client_slug }} --module ${{ inputs.module_name }} --status ${{ steps.update.outcome }}
        env:
          SMTP_CREDS: '${{ secrets.SMTP_CREDS }}'
