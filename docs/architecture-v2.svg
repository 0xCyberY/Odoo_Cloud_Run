<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <style>
    .h1 { font-size: 22px; font-weight: bold; fill: #202124; }
    .h2 { font-size: 13px; font-weight: bold; fill: #202124; }
    .t  { font-size: 11.5px; fill: #3c4043; }
    .ts { font-size: 10.5px; fill: #5f6368; }
    .fix { font-size: 10px; font-weight: bold; fill: #188038; }
    .new { font-size: 10px; font-weight: bold; fill: #a142f4; }
    .lbl { font-size: 10.5px; fill: #5f6368; font-style: italic; }
    .band { font-size: 11px; font-weight: bold; fill: #5f6368; letter-spacing: 1px; }
    .req { stroke: #5f6368; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .async { stroke: #5f6368; stroke-width: 1.4; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 4; }
  </style>

  <rect x="0" y="0" width="1500" height="1120" fill="#ffffff"/>
  <text x="40" y="36" class="h1">Multi-Tenant Odoo 18 on Cloud Run — Hardened Architecture (as implemented)</text>
  <text x="40" y="56" class="ts">GCP project: nomowsoft-poc · ONE pooled image with the full sellable addon catalog · tenants segregated per database · per-tenant entitlements enforced at runtime · clients.yaml is the single source of truth</text>

  <!-- ═══════════ EDGE ═══════════ -->
  <text x="40" y="88" class="band">EDGE</text>

  <rect x="120" y="72" width="150" height="28" rx="6" fill="#ffffff" stroke="#dadce0"/>
  <text x="195" y="90" text-anchor="middle" class="t">acme.droob.app</text>
  <rect x="290" y="72" width="150" height="28" rx="6" fill="#ffffff" stroke="#dadce0"/>
  <text x="365" y="90" text-anchor="middle" class="t">beta.droob.app</text>
  <rect x="460" y="72" width="150" height="28" rx="6" fill="#ffffff" stroke="#dadce0"/>
  <text x="535" y="90" text-anchor="middle" class="t">mac.droob.app …</text>

  <line x1="195" y1="100" x2="195" y2="118" class="req"/>
  <line x1="365" y1="100" x2="365" y2="118" class="req"/>
  <line x1="535" y1="100" x2="535" y2="118" class="req"/>

  <rect x="60" y="120" width="1390" height="66" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="76" y="142" class="h2">Global External Application Load Balancer</text>
  <text x="76" y="160" class="t">Static IP · Google-managed SSL (SANs from clients.yaml + odoo.droob.app anchor) · host-based routing</text>
  <rect x="680" y="132" width="110" height="24" rx="12" fill="#ffffff" stroke="#1a73e8"/>
  <text x="735" y="148" text-anchor="middle" class="t">Cloud CDN</text>
  <rect x="805" y="132" width="420" height="24" rx="12" fill="#ffffff" stroke="#1a73e8"/>
  <text x="1015" y="148" text-anchor="middle" class="t">Cloud Armor: WAF · per-IP login throttle · per-tenant (Host) rate limit</text>
  <text x="1235" y="148" class="fix">#7</text>

  <!-- ALB to services -->
  <line x1="260" y1="186" x2="260" y2="228" class="req"/>
  <text x="268" y="212" class="lbl">default (dbfilter = ^(%d|%h)$)</text>
  <line x1="655" y1="186" x2="655" y2="228" class="req"/>
  <text x="663" y="212" class="lbl">/websocket, /websocket/*</text>

  <!-- ═══════════ COMPUTE ═══════════ -->
  <text x="40" y="222" class="band">COMPUTE — CLOUD RUN (one image, ODOO_MODE selects the role)</text>

  <!-- pooled -->
  <rect x="60" y="230" width="400" height="158" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="76" y="252" class="h2">pooled-odoo — web tier (all tenants)</text>
  <text x="430" y="252" text-anchor="end" class="fix">#2 #3</text>
  <text x="76" y="270" class="t">Threaded Odoo · max_cron_threads = 0 · timeout 3600s</text>
  <text x="76" y="286" class="t">min = 1 (no cold starts) + startup CPU boost · max = 3</text>
  <text x="76" y="302" class="t">env: ODOO_ENTITLEMENTS · SERVER_ENV_CONFIG · ODOO_DATABASES</text>
  <rect x="76" y="314" width="368" height="58" rx="6" fill="#ffffff" stroke="#34a853" stroke-dasharray="4 3"/>
  <text x="90" y="332" class="h2" font-size="11.5">pgbouncer sidecar · 127.0.0.1:6432</text>
  <text x="404" y="332" text-anchor="end" class="fix">#2 #4</text>
  <text x="90" y="348" class="t">pools/caps Cloud SQL connections (session mode)</text>
  <text x="90" y="362" class="t">maps each tenant DB → its own least-privilege PG user</text>

  <!-- websocket -->
  <rect x="490" y="230" width="330" height="158" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="506" y="252" class="h2">websocket-odoo — gevent worker</text>
  <text x="790" y="252" text-anchor="end" class="fix">#3</text>
  <text x="506" y="270" class="t">Longpolling · chat · live notifications (bus)</text>
  <text x="506" y="286" class="t">ODOO_MODE=websocket · session affinity · min = 1</text>
  <rect x="506" y="314" width="298" height="58" rx="6" fill="#ffffff" stroke="#34a853" stroke-dasharray="4 3"/>
  <text x="520" y="332" class="h2" font-size="11.5">pgbouncer sidecar</text>
  <text x="520" y="348" class="t">same per-tenant credential map</text>
  <text x="520" y="362" class="t">(LISTEN/NOTIFY safe: session pooling)</text>

  <!-- cron runner -->
  <rect x="850" y="230" width="330" height="158" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="866" y="252" class="h2">cron-runner-odoo — the ONLY cron</text>
  <text x="1150" y="252" text-anchor="end" class="fix">#8</text>
  <text x="866" y="270" class="t">max_instances = 1 → no duplicate scheduled jobs</text>
  <text x="866" y="286" class="t">ODOO_MODE=cron · db_name = all tenant DBs</text>
  <text x="866" y="302" class="t">internal-only · no ALB backend · CPU always on</text>
  <rect x="866" y="314" width="298" height="58" rx="6" fill="#ffffff" stroke="#34a853" stroke-dasharray="4 3"/>
  <text x="880" y="332" class="h2" font-size="11.5">pgbouncer sidecar</text>
  <text x="880" y="348" class="t">same per-tenant credential map</text>
  <text x="880" y="362" class="t">crons run under each tenant's own user</text>

  <!-- jobs + tasks -->
  <rect x="1210" y="230" width="240" height="122" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="1226" y="252" class="h2">Cloud Run Jobs (per tenant)</text>
  <text x="1226" y="270" class="t">db-setup — least-privilege hardening</text>
  <text x="1226" y="286" class="t">init — base,web,gcs_att,entitlement</text>
  <text x="1226" y="302" class="t">migration — odoo -u &lt;mod&gt; / -u all</text>
  <text x="1226" y="318" class="t">heavy ops — no request timeout limits</text>
  <text x="1226" y="338" class="new">operator context: ODOO_ENTITLEMENT_BYPASS=1</text>

  <rect x="1210" y="360" width="240" height="30" rx="8" fill="#ffffff" stroke="#34a853" stroke-dasharray="5 4"/>
  <text x="1226" y="379" class="t">Cloud Tasks queue "odoo-heavy-ops"</text>

  <!-- compute to VPC arrows -->
  <line x1="260" y1="388" x2="260" y2="448" class="req"/>
  <line x1="655" y1="388" x2="655" y2="448" class="req"/>
  <line x1="1015" y1="388" x2="1015" y2="448" class="req"/>
  <text x="268" y="428" class="lbl">Direct VPC Egress — private IPs only</text>
  <line x1="1300" y1="352" x2="1160" y2="448" class="req"/>
  <text x="1168" y="420" class="lbl">tenant user creds</text>

  <!-- ═══════════ DATA ═══════════ -->
  <text x="40" y="442" class="band">DATA</text>

  <rect x="60" y="450" width="1120" height="250" rx="10" fill="#f8f9fa" stroke="#9aa0a6" stroke-dasharray="7 5"/>
  <text x="76" y="472" class="h2" fill="#5f6368">Shared VPC (odoo-vpc) — private services access, no public endpoints</text>

  <rect x="90" y="486" width="400" height="196" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="106" y="508" class="h2">Cloud SQL — PostgreSQL 16 (odoo-shared-pg)</text>
  <text x="470" y="508" text-anchor="end" class="fix">#1 #2 #4</text>
  <text x="106" y="528" class="t">One database per tenant (acme, beta, mac, …)</text>
  <text x="106" y="544" class="t">Per-tenant least-privilege PG user — owns only its DB</text>
  <text x="106" y="560" class="t">(REVOKE CONNECT FROM PUBLIC via db-setup job)</text>
  <text x="106" y="576" class="t">Per-role statement_timeout + connection limits</text>
  <text x="106" y="592" class="t">PITR + automated backups · Query Insights</text>
  <rect x="106" y="606" width="368" height="62" rx="6" fill="#ffffff" stroke="#f9ab00"/>
  <text x="120" y="626" class="h2" font-size="11.5">HA is one variable away</text>
  <text x="120" y="642" class="t">db_availability_type: ZONAL (POC, default)</text>
  <text x="120" y="656" class="t">→ REGIONAL: standby + auto failover (~2× cost)</text>

  <rect x="520" y="486" width="310" height="88" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="536" y="508" class="h2">Memorystore Redis</text>
  <text x="536" y="526" class="t">Shared session store (session_redis,</text>
  <text x="536" y="540" class="t">loaded server-wide) — required because</text>
  <text x="536" y="554" class="t">Cloud Run instances are stateless</text>

  <rect x="520" y="592" width="310" height="90" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="536" y="614" class="h2">Secret Manager</text>
  <text x="800" y="614" text-anchor="end" class="fix">#4</text>
  <text x="536" y="632" class="t">Per-tenant DB passwords (pgbouncer map)</text>
  <text x="536" y="646" class="t">Per-tenant Odoo admin credentials</text>
  <text x="536" y="660" class="t">No hardcoded secrets · per-secret IAM</text>

  <rect x="860" y="486" width="300" height="196" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="876" y="508" class="h2">Cloud Storage (GCS)</text>
  <text x="1140" y="508" text-anchor="end" class="fix">#6</text>
  <text x="876" y="528" class="t">One attachments bucket per tenant</text>
  <text x="876" y="544" class="t">OCA fs_storage + fs_attachment (18.0)</text>
  <text x="876" y="560" class="t">Backend config via SERVER_ENV_CONFIG</text>
  <text x="876" y="576" class="t">(server_environment) — NOT DB fields</text>
  <rect x="876" y="588" width="268" height="82" rx="6" fill="#ffffff" stroke="#f9ab00"/>
  <text x="890" y="607" class="h2" font-size="11.5">Attachment routing (survives rolls)</text>
  <text x="890" y="623" class="t">JS/CSS asset bundles → stored in the DB</text>
  <text x="890" y="637" class="t">Other attachments → per-tenant GCS bucket</text>
  <text x="890" y="651" class="t">Local Cloud Run filestore is ephemeral —</text>
  <text x="890" y="663" class="t">nothing durable is kept on it</text>

  <!-- ═══════════ ENTITLEMENT PLANE ═══════════ -->
  <rect x="1195" y="450" width="255" height="250" rx="10" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.5"/>
  <text x="1211" y="472" class="h2">Addon Catalog &amp; Entitlements</text>
  <text x="1439" y="472" text-anchor="end" class="new">NEW</text>
  <text x="1211" y="490" class="t">Full sellable catalog baked into the ONE</text>
  <text x="1211" y="504" class="t">pooled image (clients.yaml `catalog:`).</text>
  <text x="1211" y="520" class="t">Entitlement plane (runtime, no rebuild):</text>
  <text x="1211" y="534" class="t">ODOO_ENTITLEMENTS env = db → catalog</text>
  <text x="1211" y="548" class="t">dirs, from each client's addon_repos.</text>
  <rect x="1209" y="558" width="228" height="130" rx="6" fill="#ffffff" stroke="#a142f4"/>
  <text x="1223" y="577" class="h2" font-size="11.5">addon_entitlement (every DB)</text>
  <text x="1223" y="593" class="t">Hides + hard-blocks unentitled apps</text>
  <text x="1223" y="607" class="t">and their dependency closure</text>
  <text x="1223" y="621" class="t">Blocks base_import_module (sideload)</text>
  <text x="1223" y="635" class="t">Gate bypassed only in operator Jobs</text>
  <text x="1223" y="649" class="t">(env boundary, not "is there a request")</text>
  <text x="1223" y="666" class="t">Daily audit → ENTITLEMENT_VIOLATION</text>
  <text x="1223" y="680" class="t">log metric + alert</text>

  <!-- ═══════════ CI/CD ═══════════ -->
  <text x="40" y="732" class="band">CI/CD</text>
  <rect x="60" y="740" width="1390" height="130" rx="10" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="76" y="762" class="h2">Safe fleet upgrades — GitHub Actions "deploy-fleet" (Workload Identity Federation; no long-lived keys)</text>
  <text x="1434" y="762" text-anchor="end" class="fix">#5 #6</text>

  <rect x="76" y="776" width="205" height="76" rx="6" fill="#ffffff" stroke="#ea4335"/>
  <text x="90" y="796" class="h2" font-size="11.5">1 · Addon catalog</text>
  <text x="90" y="812" class="t">prepare_addons.py clones</text>
  <text x="90" y="826" class="t">common + the full catalog</text>
  <text x="90" y="840" class="t">from clients.yaml</text>

  <line x1="281" y1="814" x2="303" y2="814" class="req"/>

  <rect x="305" y="776" width="205" height="76" rx="6" fill="#ffffff" stroke="#ea4335"/>
  <text x="319" y="796" class="h2" font-size="11.5">2 · Build (Cloud Build)</text>
  <text x="319" y="812" class="t">Immutable git-SHA tag →</text>
  <text x="319" y="826" class="t">Artifact Registry</text>
  <text x="319" y="840" class="t">(odoo-pooled + pgbouncer)</text>

  <line x1="510" y1="814" x2="532" y2="814" class="req"/>

  <rect x="534" y="776" width="205" height="76" rx="6" fill="#ffffff" stroke="#ea4335"/>
  <text x="548" y="796" class="h2" font-size="11.5">3 · CI smoke test</text>
  <text x="548" y="812" class="t">Install session_redis, fs_*,</text>
  <text x="548" y="826" class="t">gcs_attachment_default,</text>
  <text x="548" y="840" class="t">addon_entitlement vs PG 16</text>

  <line x1="739" y1="814" x2="761" y2="814" class="req"/>

  <rect x="763" y="776" width="185" height="76" rx="6" fill="#ffffff" stroke="#ea4335"/>
  <text x="777" y="796" class="h2" font-size="11.5">4 · No-traffic revision</text>
  <text x="777" y="812" class="t">New pooled revision</text>
  <text x="777" y="826" class="t">deployed serving 0%</text>

  <line x1="948" y1="814" x2="970" y2="814" class="req"/>

  <rect x="972" y="776" width="230" height="76" rx="6" fill="#ffffff" stroke="#ea4335"/>
  <text x="986" y="796" class="h2" font-size="11.5">5 · Cloud Workflows migration</text>
  <text x="986" y="812" class="t">odoo-fleet-migration: per-tenant</text>
  <text x="986" y="826" class="t">migration Jobs, SEQUENTIAL,</text>
  <text x="986" y="840" class="t">halt on fail · resume (start_from)</text>

  <line x1="1202" y1="814" x2="1224" y2="814" class="req"/>

  <rect x="1226" y="776" width="208" height="76" rx="6" fill="#ffffff" stroke="#ea4335"/>
  <text x="1240" y="796" class="h2" font-size="11.5">6 · Canary traffic shift</text>
  <text x="1240" y="812" class="t">10% → 50% → 100% with health</text>
  <text x="1240" y="826" class="t">gates · instant rollback to the</text>
  <text x="1240" y="840" class="t">previous revision on failure</text>

  <!-- ═══════════ BOTTOM ═══════════ -->
  <rect x="60" y="900" width="680" height="160" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="76" y="922" class="h2">Observability — Cloud Monitoring + Logging</text>
  <text x="724" y="922" text-anchor="end" class="fix">#7</text>
  <text x="76" y="942" class="t">Uptime check per tenant domain (/web/health) · alerts: 5xx rate, p95 latency,</text>
  <text x="76" y="958" class="t">DB CPU + connection saturation, Redis memory, job failures</text>
  <text x="76" y="974" class="t">Log-based metrics: cron failures · addon ENTITLEMENT_VIOLATION</text>
  <text x="76" y="990" class="t">Labels app/tenant/tier on services, jobs, buckets → cost breakdown per client</text>
  <text x="76" y="1012" class="ts">alert_email variable enables the email notification channel</text>
  <text x="76" y="1038" class="ts">Canary health gate probes the odoo.droob.app anchor (belongs to no tenant)</text>

  <rect x="770" y="900" width="680" height="160" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="786" y="922" class="h2">Tenant provisioning — fully automated (provision.py / provision-client.yml)</text>
  <text x="786" y="942" class="t">1 · terraform/shared apply — tenant SQL user + secret, pgbouncer map, SSL domain, uptime check</text>
  <text x="786" y="958" class="t">2 · tenant workspace apply — database, GCS bucket, db-setup/init/migration jobs, DNS</text>
  <text x="786" y="974" class="t">3 · db-setup job — REVOKE CONNECT · DB ownership → tenant user · timeouts + conn limits</text>
  <text x="786" y="990" class="t">4 · init job — odoo -i base,web,gcs_attachment_default,addon_entitlement --without-demo=all</text>
  <text x="786" y="1012" class="ts">A new tenant is live in minutes — zero manual steps. Selling an addon = one addon_repos line + shared apply (no rebuild).</text>
  <text x="786" y="1038" class="ts">Existing tenants adopt a new platform module via a one-time migration-job backfill (-i &lt;module&gt;).</text>

  <!-- legend -->
  <line x1="770" y1="710" x2="820" y2="710" class="req"/>
  <text x="828" y="714" class="ts">request traffic</text>
  <line x1="960" y1="710" x2="1010" y2="710" class="async"/>
  <text x="1018" y="714" class="ts">async / control plane</text>
  <text x="1200" y="714" class="fix">#n = v2 fix closed (see README)</text>
  <text x="1200" y="730" class="new">NEW = added after the v2 baseline</text>
</svg>
