# clients/clients.yaml
common_addon_repo: 'github.com/nomowsoft/Common.git'

# ── Sellable addon catalog ───────────────────────────────────────────────────
# EVERY addon repo the platform offers, keyed by its build-addons/ directory
# name. The FULL catalog is baked into the pooled image on every build (code
# plane), so selling an addon to a client never requires an image rebuild —
# per-client visibility/install is enforced at runtime by the
# addon_entitlement platform module from the ODOO_ENTITLEMENTS env var, which
# terraform/shared renders from each client's addon_repos below (entitlement
# plane). Adding a NEW catalog entry IS a product release: deploy-fleet must
# run so the code lands in the image.
# NOTE: the key 'common' is reserved (the common_addon_repo clone dir).
catalog:
  Human-Resources:
    repo:   'github.com/nomowsoft/Human-Resources.git'
    branch: '18.0'
  Accounting:
    repo:   'github.com/nomowsoft/Accounting.git'
    branch: '18.0'
  Odoo-Customization-Module:
    repo:   'github.com/nomowsoft/Odoo-Customization-Module.git'
    branch: '18.0'

# Per-client schema:
#   domain            REQUIRED — the client's domain, e.g. acme.com or a
#                     nomowsoft.com subdomain like acme.nomowsoft.com. DNS
#                     (A record + Certificate Manager CNAME) is always a
#                     manual step at the domain's own DNS provider — this
#                     repo never manages a client's DNS itself
#   region, database, db_user, gcp_project   (as today)
#   addon_repos       catalog keys this client is entitled to (billing)
#   selected_addons   OPTIONAL subset of addon_repos to auto-install on
#                     provisioning; anything entitled-but-unselected stays
#                     installable via Apps, just not auto-installed
#   contact_email     OPTIONAL, validated when present — never used as the
#                     destination for admin credentials (those go to
#                     NOTIFY_EMAIL_TO, a DevOps/Product distribution list)
clients:
  acme-corp:
    # database is named after the subdomain (dbfilter ^(%d|%h)$): acme.nomowsoft.com → acme
    domain:      acme.nomowsoft.com
    region:      europe-west1
    database:    acme
    db_user:     acme_production2
    gcp_project: project-b85b49c5-5bdc-48ac-989
    # Catalog keys this client is entitled to (billing source of truth).
    # Selling an addon = add its key here + `terraform -chdir=terraform/shared apply`.
    addon_repos: [Human-Resources, Accounting, Odoo-Customization-Module]

  beta-corp:
    domain:      beta.nomowsoft.com
    region:      europe-west1
    database:    beta
    db_user:     beta_production
    gcp_project: project-b85b49c5-5bdc-48ac-989
    addon_repos: [Human-Resources, Accounting, Odoo-Customization-Module]

  mac-corp:
    domain:      mac.nomowsoft.com
    region:      europe-west1
    database:    mac
    db_user:     mac_production
    gcp_project: project-b85b49c5-5bdc-48ac-989
    addon_repos: [Human-Resources, Accounting, Odoo-Customization-Module]
